<!DOCTYPE html>
<html lang="en">
<head>
    <title>OTP Verification</title>
    <style>
        body {
            background: url('https://wallpaperaccess.com/full/3543885.jpg') no-repeat center center/cover;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            width: 350px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
        }
        h2 {
            margin-bottom: 15px;
            font-size: 24px;
            color: #fff;
        }
        .input-box {
            width: 100%;
            margin: 10px 0;
        }
        input {
            width: 90%;
            padding: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-size: 14px;
            color: #fff;
            outline: none;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: linear-gradient(45deg, #ff6b6b, #f06595);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
        }
        button:hover {
            background: linear-gradient(45deg, #e63946, #d6336c);
        }
        p {
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>OTP Verification</h2>
        <form action="/otp-verification" method="POST">
            <div class="input-box">
                <input type="text" name="otp" placeholder="Enter OTP" required>
            </div>
            <button type="submit">Verify</button>
        </form>
    </div>
</body>
</html>
